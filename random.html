  <script>
    let cafes = [];
    let currentPickMode = 'open';
    document.addEventListener('DOMContentLoaded', () => {
      cafes = getParsedCafes();
      rollRandomCafe(false);
    });
    function setPickMode(mode) {
      currentPickMode = mode;
      const btnOpen = document.getElementById('pickModeOpen');
      const btnAll = document.getElementById('pickModeAll');
      const notice = document.getElementById('rNoticeText');
      if (mode === 'open') {
        btnOpen.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition bg-espresso text-white shadow-xs";
        btnAll.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition text-espresso hover:bg-sand/60";
        notice.textContent = "※ 目前模式：僅自當前營業中的店家盲抽，出門不撲空。";
      } else {
        btnAll.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition bg-espresso text-white shadow-xs";
        btnOpen.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition text-espresso hover:bg-sand/60";
        notice.textContent = "※ 目前模式：抽取全部已收錄店家，包含休息中店家。";
      }
      rollRandomCafe(true);
    }
    function rollRandomCafe(triggerAnimation = true) {
      let pool = cafes.filter(c => !c.isClosedPermanent && !c.isClosedTemp);
      if (currentPickMode === 'open') {
        const openPool = pool.filter(c => getCafeRealtimeStatus(c).isOpenNow);
        if (openPool.length > 0) pool = openPool;
        else showToast('當前多數店家已打烊，為您自全部名單抽選');
      }
      if (pool.length === 0) return;
      const diceBox = document.getElementById('diceBox');
      const randomCard = document.getElementById('randomCard');
      if (triggerAnimation) {
        diceBox.classList.remove('animate-shake-dice');
        randomCard.classList.remove('animate-rumble-card');
        void diceBox.offsetWidth;
        diceBox.classList.add('animate-shake-dice');
      }
      setTimeout(() => {
        const picked = pool[Math.floor(Math.random() * pool.length)];
        const status = getCafeRealtimeStatus(picked);
        document.getElementById('rStatus').textContent = status.label;
        document.getElementById('rStatus').className = `text-[13px] font-bold px-2.5 py-0.5 rounded ${status.color}`;
        document.getElementById('rRegion').textContent = picked.region;
        document.getElementById('rPrice').textContent = picked.price;
        document.getElementById('rMainTitle').textContent = picked.mainTitle;
        const subElem = document.getElementById('rSubTitle');
        if (picked.subTitle) { subElem.textContent = picked.subTitle; subElem.classList.remove('hidden'); } else { subElem.textContent = ''; subElem.classList.add('hidden'); }
        document.getElementById('rHours').textContent = picked.hours;
        document.getElementById('rNotes').textContent = picked.notes;
        document.getElementById('rSocket').textContent = picked.socketDesc;
        document.getElementById('rTime').textContent = picked.timeDesc;
        document.getElementById('rBadges').innerHTML = picked.tags.map(t => `<span class="px-2.5 py-1 rounded bg-cream text-espresso font-medium">#${t}</span>`).join('');
        document.getElementById('rMapBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(picked.fullName)}`;
        if (triggerAnimation) randomCard.classList.add('animate-rumble-card');
      }, triggerAnimation ? 260 : 0);
    }
  </script>
