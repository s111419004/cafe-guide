  <script>
    let cafes = [];
    let selectedDemandTags = new Set();
    let selectedRegion = '全部';
    let searchQuery = '';
    let currentDetailCafe = null;
    const DEMAND_TAGS = ['適合讀書工作', '有插座', '不限時', '安靜專注', '深夜營業', '正餐鹹食', '店貓/寵物友善'];
    document.addEventListener('DOMContentLoaded', () => {
      cafes = getParsedCafes();
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.getAll('tag').forEach(t => selectedDemandTags.add(t));
      const q = urlParams.get('q');
      if (q) { searchQuery = q; document.getElementById('searchInput').value = q; }
      renderFilterControls();
      applyFilters();
    });
    function renderFilterControls() {
      document.getElementById('demandTagsContainer').innerHTML = DEMAND_TAGS.map(tag => `
        <button onclick="toggleDemandTag('${tag}')" class="px-3 py-1.5 rounded-full text-[13px] font-semibold border transition flex items-center gap-1.5 ${selectedDemandTags.has(tag) ? 'bg-espresso text-white border-espresso shadow-xs' : 'bg-cream/50 text-espresso border-sand hover:bg-cream'}">
          <span>#${tag}</span>
        </button>
      `).join('');
      const regions = ['全部', '雙北捷運市區', '新竹地區', '台中地區', '嘉義/彰化', '桃園地區'];
      document.getElementById('regionContainer').innerHTML = regions.map(reg => {
        const count = reg === '全部' ? cafes.length : cafes.filter(c => c.region === reg).length;
        return `<button onclick="setRegion('${reg}')" class="px-3.5 py-1.5 rounded-xl text-[13px] font-bold border transition ${selectedRegion === reg ? 'bg-espresso text-white border-espresso shadow-xs' : 'bg-white text-espresso border-sand hover:bg-cream'}">${reg} (${count})</button>`;
      }).join('');
    }
    function toggleDemandTag(tag) {
      if (selectedDemandTags.has(tag)) selectedDemandTags.delete(tag); else selectedDemandTags.add(tag);
      renderFilterControls(); applyFilters();
    }
    function setRegion(reg) { selectedRegion = reg; renderFilterControls(); applyFilters(); }
    function resetAllFilters() {
      selectedDemandTags.clear(); selectedRegion = '全部'; searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('onlyOpenNowToggle').checked = false;
      document.getElementById('timeSlotSelect').value = 'all';
      document.getElementById('hideClosedToggle').checked = true;
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderFilterControls(); applyFilters();
    }
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchQuery);
      applyFilters();
    }
    function clearSearch() { document.getElementById('searchInput').value = ''; handleSearch(); }
    function applyFilters() {
      const hideClosed = document.getElementById('hideClosedToggle').checked;
      const onlyOpenNow = document.getElementById('onlyOpenNowToggle').checked;
      const timeSlot = document.getElementById('timeSlotSelect').value;
      const filtered = cafes.filter(cafe => {
        if (hideClosed && (cafe.isClosedPermanent || cafe.isClosedTemp)) return false;
        if (selectedRegion !== '全部' && cafe.region !== selectedRegion) return false;
        for (const tag of selectedDemandTags) { if (!cafe.tags.includes(tag)) return false; }
        const status = getCafeRealtimeStatus(cafe);
        if (onlyOpenNow && !status.isOpenNow) return false;
        if (timeSlot !== 'all') {
          if (timeSlot === 'now' && !status.isOpenNow) return false;
          const match = cafe.hours.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
          if (match) {
            const openH = parseInt(match[1], 10);
            let closeH = parseInt(match[3], 10);
            if (closeH <= openH) closeH += 24;
            if (timeSlot === 'morning' && openH > 12) return false;
            if (timeSlot === 'night' && closeH < 21) return false;
            if (timeSlot === 'midnight' && closeH < 23) return false;
          }
        }
        if (searchQuery) {
          const pool = (cafe.fullName + ' ' + cafe.notes + ' ' + cafe.region + ' ' + cafe.tags.join(' ')).toLowerCase();
          if (!pool.includes(searchQuery)) return false;
        }
        return true;
      });
      renderCafeList(filtered); renderActivePills();
    }
    function renderActivePills() {
      const container = document.getElementById('activePillsContainer');
      const pills = [];
      if (selectedRegion !== '全部') pills.push(`<span>📍 ${selectedRegion}</span>`);
      selectedDemandTags.forEach(t => pills.push(`<span>#${t}</span>`));
      if (document.getElementById('onlyOpenNowToggle').checked) pills.push(`<span>🟢 營業中</span>`);
      if (searchQuery) pills.push(`<span>🔍 "${searchQuery}"</span>`);
      container.innerHTML = pills.length === 0 ? `<span class="text-caramel/70">無 (顯示全部)</span>` : pills.map(p => `<span class="inline-flex items-center px-2.5 py-0.5 rounded-md bg-cream text-espresso text-[13px] font-medium border border-sand">${p}</span>`).join('');
    }
    function renderCafeList(list) {
      const grid = document.getElementById('cafeGrid');
      document.getElementById('matchCount').textContent = list.length;
      if (list.length === 0) { grid.innerHTML = ''; document.getElementById('emptyState').classList.remove('hidden'); return; }
      document.getElementById('emptyState').classList.add('hidden');
      grid.innerHTML = list.map(cafe => {
        const status = getCafeRealtimeStatus(cafe);
        const isFav = favorites.includes(cafe.id);
        return `
          <div onclick="openDetailModal('${cafe.id}')" class="cafe-card bg-white rounded-2xl border border-sand p-5 flex flex-col justify-between cursor-pointer group shadow-2xs relative">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2 text-[13px]">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-bold ${status.color}">
                    ${status.isOpenNow ? '<span class="pulse-dot"></span>' : ''}
                    <span>${status.label}</span>
                  </span>
                  <span class="px-2 py-0.5 rounded bg-cream text-espresso font-medium">${cafe.region}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-caramel font-semibold">${cafe.price}</span>
                  <button onclick="toggleFavorite(event, '${cafe.id}')" class="w-7 h-7 rounded-lg text-caramel hover:text-terracotta hover:bg-cream flex items-center justify-center transition">
                    <i class="${isFav ? 'fa-solid text-terracotta' : 'fa-regular'} fa-bookmark"></i>
                  </button>
                </div>
              </div>
              <div class="mb-2">
                <h3 class="font-serif font-black text-lg text-espresso group-hover:text-terracotta transition leading-snug">${cafe.mainTitle}</h3>
                ${cafe.subTitle ? `<p class="text-[13px] text-caramel truncate mt-0.5">${cafe.subTitle}</p>` : ''}
              </div>
              <div class="text-[13px] text-caramel flex items-center gap-1.5 mb-2.5">
                <i class="fa-regular fa-clock text-terracotta"></i>
                <span>今日時間：<b class="text-espresso font-medium">${cafe.hours}</b></span>
              </div>
              <div class="p-3 bg-oat rounded-xl border border-sand/60 text-[13px] text-espresso leading-relaxed mb-3 line-clamp-2">${cafe.notes}</div>
              <div class="grid grid-cols-2 gap-2 text-[13px] text-caramel mb-3">
                <div class="truncate"><i class="fa-solid fa-plug text-terracotta mr-1 text-[11px]"></i><span>${cafe.socketDesc}</span></div>
                <div class="truncate"><i class="fa-regular fa-hourglass-half text-terracotta mr-1 text-[11px]"></i><span>${cafe.timeDesc}</span></div>
              </div>
            </div>
            <div class="pt-3 border-t border-sand/60 flex items-center justify-between gap-2 text-[13px]">
              <span class="text-terracotta font-semibold flex items-center gap-1 group-hover:translate-x-0.5 transition"><span>詳細資訊</span><i class="fa-solid fa-angle-right text-[11px]"></i></span>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cafe.fullName)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="px-3 py-1.5 rounded-lg bg-cream hover:bg-espresso hover:text-white text-espresso font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-map-location-dot text-xs text-terracotta"></i><span>地圖</span>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }
    function openDetailModal(cafeId) {
      const cafe = cafes.find(c => c.id === cafeId);
      if (!cafe) return;
      currentDetailCafe = cafe;
      const status = getCafeRealtimeStatus(cafe);
      document.getElementById('modalStatusBadge').textContent = status.label;
      document.getElementById('modalStatusBadge').className = `text-[13px] font-bold px-2.5 py-0.5 rounded ${status.color.replace('bg-', 'bg-opacity-90 bg-')}`;
      document.getElementById('modalRegionBadge').textContent = cafe.region;
      document.getElementById('modalPriceBadge').textContent = cafe.price;
      document.getElementById('modalMainTitle').textContent = cafe.mainTitle;
      const subElem = document.getElementById('modalSubTitle');
      if (cafe.subTitle) { subElem.textContent = cafe.subTitle; subElem.classList.remove('hidden'); } else { subElem.textContent = ''; subElem.classList.add('hidden'); }
      document.getElementById('modalHoursText').textContent = cafe.hours;
      document.getElementById('modalNotes').textContent = cafe.notes;
      document.getElementById('modalSocketText').textContent = cafe.socketDesc;
      document.getElementById('modalTimeLimitText').textContent = cafe.timeDesc;
      document.getElementById('modalTagsContainer').innerHTML = cafe.tags.map(t => `<span class="px-2.5 py-1 rounded-md bg-sand/60 text-espresso text-[13px] font-medium">#${t}</span>`).join('');
      document.getElementById('modalMapBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cafe.fullName)}`;
      updateModalFavButton();
      document.getElementById('detailModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.body.style.overflow = '';
      currentDetailCafe = null;
    }
    function closeAllModals(e) { if (e.target.id === 'detailModal') closeDetailModal(); }
    function updateModalFavButton() {
      if (!currentDetailCafe) return;
      const isFav = favorites.includes(currentDetailCafe.id);
      const btn = document.getElementById('modalFavBtn');
      btn.onclick = () => toggleFavorite(null, currentDetailCafe.id);
      btn.innerHTML = isFav ? `<i class="fa-solid fa-bookmark text-terracotta"></i> <span>已在口袋</span>` : `<i class="fa-regular fa-bookmark"></i> <span>加入口袋</span>`;
    }
  </script>
</body>
</html>
